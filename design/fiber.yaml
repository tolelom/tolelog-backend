version: 0.5
go_module: tolelom_api

executables:
  server: { composes: [router, config, middleware, utils] }

tiers: [base, infra, domain, edge, app]

modules:
  model:      { tier: base, role: data, path: internal/model }
  utils:      { tier: base, path: internal/utils, depends_on: [model] }
  validate:   { tier: base, path: internal/validate }
  dto:        { tier: base, role: data, path: internal/dto, depends_on: [model, utils] }
  docs:       { tier: base, path: docs, summary: "swaggo가 코드 주석에서 생성하는 API 문서" }
  upload:     { tier: infra, role: infra, path: internal/upload }
  config:     { tier: infra, path: internal/config, depends_on: [model] }
  httputil:   { tier: infra, path: internal/httputil, depends_on: [dto, validate] }
  post:       { tier: domain, path: internal/post, depends_on: [dto, httputil, model] }
  comment:    { tier: domain, path: internal/comment, depends_on: [dto, httputil, model] }
  series:     { tier: domain, path: internal/series, depends_on: [dto, model, validate] }
  tag:        { tier: domain, path: internal/tag, depends_on: [dto] }
  sitemap:    { tier: domain, path: internal/sitemap, depends_on: [model, utils] }
  user:       { tier: domain, path: internal/user, depends_on: [dto, model, upload, utils, validate] }
  image:      { tier: domain, path: internal/image, depends_on: [dto, upload] }
  feed:       { tier: edge, path: internal/feed, depends_on: [post, utils] }
  middleware: { tier: edge, path: internal/middleware, depends_on: [config, dto, utils] }
  router:
    tier: app
    path: internal/router
    depends_on: [comment, config, docs, dto, feed, image, middleware, post, series, sitemap, tag, user]

enums:
  post_status:
    in: model
    summary: "글 상태. draft는 작성자만 본다"
    go: { type: PostStatus, prefix: PostStatus }
    values: [draft, published]

# 코드에 손으로 쓴 sentinel 에러. comment·series에 같은 이름(ErrUnauthorized, ErrPostNotFound)이
# 따로 있어 그쪽은 ID를 따로 두고 go.name으로 Go 이름을 적는다.
errors:
  ErrPostNotFound:         { gen: false, in: post, message: "post not found" }
  ErrUnauthorized:         { gen: false, in: post, message: "unauthorized" }
  ErrNoFieldsToUpdate:     { gen: false, in: post, message: "no fields to update" }
  ErrInvalidTag:           { gen: false, in: post, message: "invalid tag parameter" }
  ErrInvalidSearchQuery:   { gen: false, in: post, message: "invalid search query" }
  ErrCommentNotFound:      { gen: false, in: comment, message: "comment not found" }
  ErrParentNotFound:       { gen: false, in: comment, message: "parent comment not found" }
  comment_post_not_found:  { gen: false, in: comment, message: "post not found", go: { name: ErrPostNotFound } }
  comment_unauthorized:    { gen: false, in: comment, message: "unauthorized", go: { name: ErrUnauthorized } }
  ErrSeriesNotFound:       { gen: false, in: series, message: "series not found" }
  ErrPostNotOwned:         { gen: false, in: series, message: "post not owned by user" }
  series_post_not_found:   { gen: false, in: series, message: "post not found", go: { name: ErrPostNotFound } }
  series_unauthorized:     { gen: false, in: series, message: "unauthorized", go: { name: ErrUnauthorized } }
  ErrUserAlreadyExists:    { gen: false, in: user, message: "user already exists" }
  ErrInvalidCredentials:   { gen: false, in: user, message: "invalid credentials" }
  ErrUserNotFound:         { gen: false, in: user, message: "user not found" }
  ErrInvalidPassword:      { gen: false, in: user, message: "invalid current password" }
  ErrSamePassword:         { gen: false, in: user, message: "new password is the same as current" }
  ErrInvalidRefreshToken:  { gen: false, in: user, message: "invalid refresh token" }
  ErrResponseSent:         { gen: false, in: httputil, message: "response already sent" }
  ErrInvalidToken:         { gen: false, in: utils, message: "invalid token" }
  ErrExpiredToken:         { gen: false, in: utils, message: "token has expired" }
  ErrTokenNotYetValid:     { gen: false, in: utils, message: "token not yet valid" }
  ErrInvalidSigningMethod: { gen: false, in: utils, message: "unexpected signing method" }
  ErrMissingClaims:        { gen: false, in: utils, message: "missing required claims" }
  ErrInvalidTokenType:     { gen: false, in: utils, message: "invalid token type" }

# model의 GORM 엔티티. 필드 전부를 적고 daemok check가 코드 struct와 대조한다(태그는 보지 않는다).
# 연관 엔티티 User는 값 필드라 ref(포인터)가 아니라 type으로 적는다.
types:
  user:
    gen: false
    in: model
    fields: { id: uint, username: string, password_hash: string, avatar_url: string, created_at: time, last_login: time, token_version: int }
  tag:
    gen: false
    in: model
    fields: { id: uint, name: string }
  series:
    gen: false
    in: model
    fields:
      id:          uint
      title:       string
      description: string
      user_id:     uint
      user:        user
      posts:       { ref: post, many: true }
      created_at:  time
      updated_at:  time
      deleted_at:  gorm.DeletedAt
  post:
    gen: false
    in: model
    fields:
      id:           uint
      title:        string
      content:      string
      user_id:      uint
      user:         user
      is_public:    bool
      status:       post_status
      tags_raw:     string
      tags:         { ref: tag, many: true }
      series_id:    { type: uint, optional: true }
      series_order: { type: int, optional: true }
      series:       { ref: series, optional: true }
      view_count:   uint
      like_count:   uint
      created_at:   time
      updated_at:   time
      deleted_at:   gorm.DeletedAt
  comment:
    gen: false
    in: model
    fields:
      id:         uint
      post_id:    uint
      user_id:    uint
      parent_id:  { type: uint, optional: true }
      content:    string
      is_edited:  bool
      user:       user
      replies:    { ref: comment, many: true }
      created_at: time
      updated_at: time
      deleted_at: gorm.DeletedAt
  post_like:
    gen: false
    in: model
    fields: { id: uint, post_id: uint, user_id: uint, created_at: time }

# post 서비스 계약. daemok check가 코드 interface와 시그니처를 대조한다.
contracts:
  post_service:
    gen: false
    in: post
    go: { name: Service }
    methods:
      create_post:      { params: { post: post }, errors: [] }
      get_post_by_id:   { params: { post_id: uint, user_id: "*uint" }, returns: [post], errors: [ErrPostNotFound, ErrUnauthorized] }
      get_public_posts: { params: { page: int, page_size: int, tag: string }, returns: ["[]post", int64], errors: [ErrInvalidTag] }
      get_user_posts:   { params: { user_id: uint, current_user_id: "*uint", page: int, page_size: int, tag: string }, returns: ["[]post", int64], errors: [ErrInvalidTag] }
      update_post:      { params: { post_id: uint, user_id: uint, req: "*dto.UpdatePostRequest" }, returns: [post], errors: [ErrPostNotFound, ErrUnauthorized, ErrNoFieldsToUpdate] }
      delete_post:      { params: { post_id: uint, user_id: uint }, errors: [ErrPostNotFound, ErrUnauthorized] }
      search_posts:     { params: { query: string, page: int, page_size: int }, returns: ["[]post", int64], errors: [] }
      toggle_like:      { params: { post_id: uint, user_id: uint }, returns: [bool, uint], errors: [] }
      is_liked:         { params: { post_id: uint, user_id: uint }, returns: [bool], errors: [] }
      get_drafts:       { params: { user_id: uint }, returns: ["[]post"], errors: [] }
